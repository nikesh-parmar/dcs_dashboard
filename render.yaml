# Render Blueprint — https://render.com/docs/blueprint-spec
# Create a Web Service from this repo; set LOOMI_MCP_URLS in the dashboard.
# Optional: attach a persistent disk at /var/data and set DATA_DIR=/var/data

services:
  - type: web
    name: loomi-data-audit
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LOOMI_MCP_URLS
        value: https://eu.connect.loomi.ai/mcp,https://uk.connect.loomi.ai/mcp
      - key: GLEAN_MCP_URL
        value: https://bloomreach-be.glean.com/mcp/default
      # APP_BASE_URL is optional — code uses RENDER_EXTERNAL_URL when present
      - key: DATA_DIR
        value: /var/data
    disk:
      name: loomi-oauth-data
      mountPath: /var/data
      sizeGB: 1
